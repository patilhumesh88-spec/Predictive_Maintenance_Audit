[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "maint-audit"
version = "1.0.0"
description = "Leakage-aware failure-risk scoring on the UCI AI4I 2020 Predictive Maintenance dataset"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0,<4",
    "numpy>=1.24,<3",
    "scipy>=1.11,<2",
    "scikit-learn>=1.4,<2",
    "joblib>=1.3,<2",
    "matplotlib>=3.7,<4",
    "seaborn>=0.13,<1",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.30,<2"]
xgb = ["xgboost>=2.0,<3"]
api = ["fastapi>=0.100", "uvicorn>=0.20", "pydantic>=2.0"]
dev = [
    "pytest>=7.4",
    "ruff>=0.4",
    "pre-commit>=3.0",
    "jupyter>=1.0",
    "ipykernel>=6.0",
    "nbconvert>=7.0",
]
all = ["maint-audit[dashboard,xgb,api,dev]"]

[project.scripts]
maint-audit-predict = "maint_audit.predict:main"

[tool.setuptools.packages.find]
include = ["maint_audit*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]
